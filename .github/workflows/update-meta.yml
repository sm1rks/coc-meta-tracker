name: Daily Meta Update

on:
  schedule:
    # Runs at 04:55 UTC every day (5 minutes before League Day resets)
    - cron: '55 4 * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch Latest Meta Data
        env:
          # You will need to add this secret to your GitHub repository!
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: npm run fetch-data

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/meta.json
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Daily meta data update at 04:55 UTC"
          git push
