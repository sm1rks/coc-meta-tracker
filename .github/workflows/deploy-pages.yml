name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# Allow this job to clone the repo, commit sync updates, and create a page deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync Latest Equipment & Icons
        run: npm run sync-equipment

      - name: Commit Auto-Synced Equipment & Icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/static_data.json src/data/equipmentMap.ts src/data/UnitMap.ts public/icons/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update units, equipment data, and icons [skip ci]"
            git push
          fi

      - name: Fetch Latest Meta Data
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: npm run fetch-data

      - name: Build the Astro Site
        run: npm run build

      - name: Verify Build & Tests
        run: npm test

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
